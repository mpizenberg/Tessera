packages:
  - frontend/app
  - packages/cip179
  - packages/client
  - packages/core
  - packages/koios
  - packages/respond-core
  - packages/respond-react
  - packages/respond-react/react18
  - packages/respond-ui
  - packages/respond-widget
  - packages/verifier
  - backend/server
  - examples/react-host
  - examples/svelte-host

allowBuilds:
  "@parcel/watcher": false
  esbuild: true
  msgpackr-extract: false
  sharp: false
  workerd: false

# `@mattpiz/tlock-js` is the maintainer's own package; its latest release is
# newer than the global `minimumReleaseAge` supply-chain delay, so allow it
# explicitly instead of relaxing the delay for every dependency.
minimumReleaseAgeExclude:
  - "@mattpiz/tlock-js"
