packages:
  - frontend/app
  - packages/amaru
  - packages/cip179
  - packages/client
  - packages/core
  - packages/dolos
  - packages/koios
  - packages/mithril
  - packages/respond-core
  - packages/respond-react
  - packages/respond-react/react18
  - packages/respond-ui
  - packages/respond-widget
  - packages/verifier
  - backend/server
  - examples/react-host
  - examples/svelte-host

allowBuilds:
  "@parcel/watcher": false
  esbuild: true
  msgpackr-extract: false
  sharp: false
  workerd: false

# Exceptions to the global `minimumReleaseAge` supply-chain delay, instead of
# relaxing it for every dependency: `@mattpiz/tlock-js` is the maintainer's own
# package; evolution 0.5.14 is one release, reviewed by the maintainer.
minimumReleaseAgeExclude:
  - "@mattpiz/tlock-js"
  - "@evolution-sdk/evolution@0.5.14"
