# Static hosting on Cloudflare Workers (assets-only: no Worker script runs, so
# asset requests are free and unmetered). One deployment per network, selected
# through an explicit named environment. Each deploy script first bakes the
# deployment values from .env.deploy into the bundle.
name = "tessera-preview"
compatibility_date = "2026-06-01"

[assets]
directory = "./dist"
# The app routes client-side (survey pages, /propose-info-action, …): unknown
# paths must serve the app shell, not 404.
not_found_handling = "single-page-application"

[env.preview]
name = "tessera-preview"

[env.preview.assets]
directory = "./dist"
not_found_handling = "single-page-application"

[env.preprod]
name = "tessera-preprod"

[env.preprod.assets]
directory = "./dist"
not_found_handling = "single-page-application"

[env.mainnet]
name = "tessera-mainnet"

[env.mainnet.assets]
directory = "./dist"
not_found_handling = "single-page-application"
