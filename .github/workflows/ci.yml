name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    name: workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No version input: the action reads the exact pnpm version from the
      # `packageManager` field in package.json (specifying both is an error).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # One install for the whole workspace, then the recursive commands the
      # README promises. This covers every package — @tessera/core,
      # @tessera/koios, @tessera/verifier, and @tessera/backend carry the
      # correctness-critical, hash-committed logic and previously never ran on
      # a PR (only frontend/cip179 + frontend/app did).
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r type-check
      - run: pnpm -r test
      - run: pnpm --filter tessera-app format:check
      - run: pnpm -r build
