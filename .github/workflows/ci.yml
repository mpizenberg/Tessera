name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    name: workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No version input: the action reads the exact pnpm version from the
      # `packageManager` field in package.json (specifying both is an error).
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # One install for the whole workspace, then the recursive commands the
      # README promises. This covers every package — @tessera/core,
      # @tessera/koios, @tessera/verifier, and @tessera/backend carry the
      # correctness-critical, hash-committed logic and previously never ran on
      # a PR (only frontend/cip179 + frontend/app did).
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r type-check
      - run: pnpm -r test
      - run: pnpm --filter tessera-app format:check
      - run: pnpm -r build

      # Bundle both Cloudflare Workers without deploying (no credentials
      # needed). `pnpm -r build` never touches the backend — it has no build
      # script — so this is the only pre-deploy check of its worker.ts bundle
      # and of both wrangler.toml files. The app's dry-run needs dist/ from
      # the build step above.
      - run: pnpm --filter @tessera/backend exec wrangler deploy --dry-run
      - run: pnpm --filter tessera-app exec wrangler deploy --dry-run
