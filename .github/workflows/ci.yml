name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI only reads the repo; never hand the job a writable token.
permissions:
  contents: read

jobs:
  workspace:
    name: workspace
    runs-on: ubuntu-latest
    # A healthy run takes ~1 min; don't let a wedged step burn the 6 h default.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # No version input: the action reads the exact pnpm version from the
      # `packageManager` field in package.json (specifying both is an error).
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # One install for the whole workspace, then the recursive commands the
      # README promises. This covers every package — cardano-tessera-core,
      # cardano-tessera-koios, cardano-tessera-verifier, and cardano-tessera-backend carry the
      # correctness-critical, hash-committed logic and previously never ran on
      # a PR (only cip-179 + frontend/app did).
      - run: pnpm install --frozen-lockfile
      # Test before type-check: the respond-widget test script builds the
      # artifact and its rolled-up d.ts, which the widget's type-checked tests
      # import from dist/.
      - run: pnpm -r test
      - run: pnpm -r type-check
      - run: pnpm format:check
      - run: pnpm -r build

      # Bundle both Cloudflare Workers without deploying (no credentials
      # needed). `pnpm -r build` never touches the backend — it has no build
      # script — so this is the only pre-deploy check of its worker.ts bundle
      # and of both wrangler.toml files. The app's dry-run needs dist/ from
      # the build step above.
      - run: pnpm --filter cardano-tessera-backend exec wrangler deploy --dry-run
      - run: pnpm --filter tessera-app exec wrangler deploy --dry-run
